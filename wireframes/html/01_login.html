<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Masuk — Rumah Cue</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #111827;
  --text-2: #4b5563;
  --muted: #6b7280;
  --accent: #1d4ed8;
  --accent-hover: #1e40af;
  --accent-soft: #eff6ff;
  --emerald: #047857;
  --emerald-soft: #ecfdf5;
  --amber: #b45309;
  --amber-soft: #fef3c7;
  --rose: #be123c;
  --rose-soft: #fff1f2;
}
body {
  font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.app-shell { display: flex; min-height: 100vh; }

/* Light, crisp enterprise sidebar */
.sidebar {
  width: 244px;
  background: #ffffff;
  border-right: 1px solid var(--border);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex-shrink: 0;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 8px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px;
  background: #111827; color: #ffffff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-name { font-weight: 700; font-size: 14.5px; color: var(--text); letter-spacing: -0.2px; }
.brand-tag { font-size: 11px; color: var(--muted); }
.nav-sec {
  font-size: 10.5px; font-weight: 600; color: #9ca3af;
  text-transform: uppercase; letter-spacing: 0.6px;
  margin: 14px 10px 6px;
}
.nav-link {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; margin-bottom: 2px;
  border-radius: 7px; color: var(--text-2);
  text-decoration: none; font-weight: 500; font-size: 13px;
}
.nav-link:hover { background: #f3f4f6; color: var(--text); }
.nav-link.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.nav-left { display: flex; align-items: center; gap: 9px; }
.nav-count {
  font-size: 11px; font-weight: 600;
  color: var(--muted); background: #f3f4f6;
  padding: 1px 7px; border-radius: 10px;
}
.nav-link.active .nav-count { background: #dbeafe; color: var(--accent); }
.user-footer {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.user-info { display: flex; align-items: center; gap: 9px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: #e5e7eb; color: #374151;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11.5px;
}

/* Main Content */
.main { flex: 1; padding: 22px 28px; min-width: 0; }
.header-bar {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 20px;
}
.crumb { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.actions { display: flex; gap: 8px; align-items: center; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 7px;
  font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--border-strong);
  background: #ffffff; color: #374151;
  cursor: pointer; text-decoration: none;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.btn-primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
.btn-dark { background: #111827; color: #ffffff; border-color: #111827; }
.btn-emerald { background: var(--emerald); color: #ffffff; border-color: var(--emerald); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); box-shadow: none; }
.btn-sm { padding: 5px 10px; font-size: 11.5px; border-radius: 6px; }
.btn-icon { padding: 5px 8px; font-size: 11.5px; border-radius: 6px; }

/* Panels & Cards */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 16px;
}
.panel-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.panel-title { font-size: 14px; font-weight: 700; color: var(--text); }
.panel-sub { font-size: 12px; color: var(--muted); }

/* Stats Strip (Unified, clean instead of 4 boxy cards) */
.stats-strip {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
}
.stat-cell {
  padding: 16px 20px;
  border-right: 1px solid var(--border);
}
.stat-cell:last-child { border-right: none; }
.stat-label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.stat-val { font-size: 22px; font-weight: 700; color: var(--text); margin: 3px 0; letter-spacing: -0.4px; }
.stat-foot { font-size: 11.5px; color: var(--text-2); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.4px;
  background: #fafafa;
  border-top: 1px solid var(--border);
}
tr:last-child td { border-bottom: none; }
.tc { text-align: center; }
.tr { text-align: right; }

/* Pills & Tags */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; font-size: 11px; font-weight: 600;
  border-radius: 6px; background: #f3f4f6; color: #374151;
}
.pill-blue { background: var(--accent-soft); color: var(--accent); }
.pill-green { background: var(--emerald-soft); color: var(--emerald); }
.pill-amber { background: var(--amber-soft); color: var(--amber); }
.pill-rose { background: var(--rose-soft); color: var(--rose); }

/* Form controls */
.input, .select {
  width: 100%; padding: 8px 11px;
  border: 1px solid var(--border-strong); border-radius: 7px;
  background: #ffffff; font-size: 12.5px; color: var(--text);
}
.label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; }

/* Segmented 1-5 score selector */
.seg-group {
  display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; background: #ffffff;
}
.seg-btn {
  padding: 4px 8px; font-size: 11.5px; font-weight: 600; color: var(--muted);
  border-right: 1px solid var(--border); min-width: 24px; text-align: center;
}
.seg-btn:last-child { border-right: none; }
.seg-btn.on { background: #111827; color: #ffffff; }
.seg-btn.on-blue { background: var(--accent); color: #ffffff; }

/* Progress bar */
.bar-bg { width: 100%; height: 7px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
.bar-fill-green { background: var(--emerald); }

/* Filter chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip {
  padding: 5px 11px; border-radius: 99px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--border-strong); background: #ffffff; color: var(--text-2);
}
.chip.active { background: #111827; color: #ffffff; border-color: #111827; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-split { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; align-items: start; }
.tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tab { padding: 8px 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #f3f4f6;
  background-image: radial-gradient(#d1d5db 1px, transparent 1px);
  background-size: 22px 22px;
}
.login-box {
  width: 100%;
  max-width: 380px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px 28px;
  box-shadow: 0 10px 30px rgba(17,24,39,0.07);
}
.input-wrap { position: relative; }
.eye-icon { position: absolute; right: 10px; top: 9px; color: #9ca3af; }
</style>
</head>

</html>
