<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>Use Case Diagram — SPK Pemilihan Supplier Rumah Cue</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #fff; color: #000; padding: 16px; }
svg { display: block; margin: 0 auto; background: #fff; }
</style></head><body>
<svg width="980" height="560" viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- System Boundary -->
  <rect x="220" y="25" width="540" height="510" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="490" y="52" text-anchor="middle" font-size="13.5" font-weight="bold">Sistem Pendukung Keputusan Pemilihan Supplier (TOPSIS)</text>

  <!-- Actor Left: Admin -->
  <circle cx="95" cy="215" r="20" fill="#fff" stroke="#1e293b" stroke-width="2"/>
  <line x1="95" y1="235" x2="95" y2="295" stroke="#1e293b" stroke-width="2"/>
  <line x1="60" y1="255" x2="130" y2="255" stroke="#1e293b" stroke-width="2"/>
  <line x1="95" y1="295" x2="65" y2="335" stroke="#1e293b" stroke-width="2"/>
  <line x1="95" y1="295" x2="125" y2="335" stroke="#1e293b" stroke-width="2"/>
  <text x="95" y="360" text-anchor="middle" font-size="13" font-weight="bold">Admin</text>
  <text x="95" y="376" text-anchor="middle" font-size="11" fill="#475569">Rumah Cue</text>

  <!-- Actor Right: Pemilik -->
  <circle cx="885" cy="215" r="20" fill="#fff" stroke="#1e293b" stroke-width="2"/>
  <line x1="885" y1="235" x2="885" y2="295" stroke="#1e293b" stroke-width="2"/>
  <line x1="850" y1="255" x2="920" y2="255" stroke="#1e293b" stroke-width="2"/>
  <line x1="885" y1="295" x2="855" y2="335" stroke="#1e293b" stroke-width="2"/>
  <line x1="885" y1="295" x2="915" y2="335" stroke="#1e293b" stroke-width="2"/>
  <text x="885" y="360" text-anchor="middle" font-size="13" font-weight="bold">Pemilik</text>
  <text x="885" y="376" text-anchor="middle" font-size="11" fill="#475569">Rumah Cue</text>

  <!-- Use Cases -->
  <!-- UC1: Login & Logout (Both) -->
  <ellipse cx="490" cy="100" rx="120" ry="24" fill="#fff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="490" y="104" text-anchor="middle" font-size="11.5" font-weight="bold">Login &amp; Logout</text>
  <line x1="130" y1="255" x2="370" y2="100" stroke="#334155" stroke-width="1.4"/>
  <line x1="850" y1="255" x2="610" y2="100" stroke="#334155" stroke-width="1.4"/>

  <!-- UC2: Kelola Data Supplier & Ketersediaan Ikan (Admin) -->
  <ellipse cx="400" cy="170" rx="135" ry="24" fill="#fff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="400" y="174" text-anchor="middle" font-size="11" font-weight="bold">Kelola Data Supplier &amp; Ketersediaan Ikan</text>
  <line x1="130" y1="255" x2="265" y2="170" stroke="#334155" stroke-width="1.4"/>

  <!-- UC3: Kelola Master Jenis Ikan (Admin) -->
  <ellipse cx="400" cy="240" rx="135" ry="24" fill="#fff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="400" y="244" text-anchor="middle" font-size="11" font-weight="bold">Kelola Master Jenis Ikan (8 Jenis)</text>
  <line x1="130" y1="255" x2="265" y2="240" stroke="#334155" stroke-width="1.4"/>

  <!-- UC4: Kelola Kriteria, Sub-Kriteria & Bobot (Pemilik) -->
  <ellipse cx="560" cy="310" rx="140" ry="24" fill="#fff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="560" y="314" text-anchor="middle" font-size="11" font-weight="bold">Kelola Kriteria, Sub-Kriteria &amp; Bobot</text>
  <line x1="850" y1="255" x2="700" y2="310" stroke="#334155" stroke-width="1.4"/>

  <!-- UC5: Input Penilaian Supplier per Jenis Ikan (Admin) -->
  <ellipse cx="385" cy="390" rx="130" ry="24" fill="#fff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="385" y="394" text-anchor="middle" font-size="11" font-weight="bold">Input Penilaian Supplier per Jenis Ikan</text>
  <line x1="130" y1="255" x2="255" y2="390" stroke="#334155" stroke-width="1.4"/>

  <!-- UC6: Hitung Peringkat TOPSIS (<<include>>) -->
  <ellipse cx="645" cy="390" rx="95" ry="24" fill="#fff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="645" y="394" text-anchor="middle" font-size="11" font-weight="bold">Hitung Peringkat TOPSIS</text>
  <line x1="515" y1="390" x2="550" y2="390" stroke="#1e293b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#open-arrow)"/>
  <text x="532" y="378" text-anchor="middle" font-size="10" fill="#475569">&laquo;include&raquo;</text>

  <!-- UC7: Lihat Hasil & Cetak Laporan PDF (Both) -->
  <ellipse cx="490" cy="475" rx="135" ry="24" fill="#fff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="490" y="479" text-anchor="middle" font-size="11.5" font-weight="bold">Lihat Hasil &amp; Cetak Laporan PDF</text>
  <line x1="130" y1="255" x2="355" y2="475" stroke="#334155" stroke-width="1.4"/>
  <line x1="850" y1="255" x2="625" y2="475" stroke="#334155" stroke-width="1.4"/>
</svg>
</body></html>
