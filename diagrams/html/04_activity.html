<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><title>Activity Diagram — Proses Penilaian & Perhitungan TOPSIS</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #ffffff;
  color: #0f172a;
  padding: 20px;
}
.title {
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  color: #0f172a;
}
svg { display: block; margin: 0 auto; background: #ffffff; }
</style></head>
<body>
<div class="title">Activity Diagram — Proses Penilaian & Perhitungan TOPSIS</div>
<svg width="880" height="660" viewBox="0 0 880 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
    <marker id="diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 0 5 L 7 1 L 14 5 L 7 9 z" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
    </marker>
  </defs>
  
<rect x="40" y="20" width="380" height="620" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<rect x="420" y="20" width="420" height="620" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
<line x1="40" y1="55" x2="840" y2="55" stroke="#1e293b" stroke-width="1.5"/>
<text x="230" y="42" text-anchor="middle" font-size="13" font-weight="700">Pemilik / Admin Rumah Cue</text>
<text x="630" y="42" text-anchor="middle" font-size="13" font-weight="700">Sistem SPK TOPSIS</text>

<!-- Initial -->
<circle cx="230" cy="85" r="10" fill="#0f172a"/>
<line x1="230" y1="95" x2="230" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- A1 -->
<rect x="135" y="115" width="190" height="36" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="230" y="137" text-anchor="middle" font-size="11.5" font-weight="600">Pilih Periode &amp; Jenis Ikan</text>
<path d="M 325 133 L 520 133" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- S1 -->
<rect x="520" y="115" width="220" height="36" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="630" y="137" text-anchor="middle" font-size="11.5" font-weight="600">Filter Supplier Penyedia Ikan</text>
<path d="M 630 151 L 630 185 L 325 185" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- A2 -->
<rect x="125" y="167" width="200" height="36" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="225" y="189" text-anchor="middle" font-size="11.5" font-weight="600">Input Nilai C1–C5 (Skala 1–5)</text>
<path d="M 225 203 L 225 230 L 578 230" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Decision -->
<polygon points="630,215 690,245 630,275 570,245" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="630" y="249" text-anchor="middle" font-size="10.5" font-weight="700">Lengkap?</text>
<path d="M 570 245 L 340 245 L 340 190 L 325 190" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="455" y="261" text-anchor="middle" font-size="10" fill="#dc2626">[Belum Lengkap]</text>

<line x1="630" y1="275" x2="630" y2="305" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="665" y="294" font-size="10" fill="#059669">[Lengkap]</text>

<!-- S2 -->
<rect x="515" y="305" width="230" height="36" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="630" y="327" text-anchor="middle" font-size="11.5" font-weight="600">Normalisasi Matriks (R) &amp; Terbobot (Y)</text>
<line x1="630" y1="341" x2="630" y2="365" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- S3 -->
<rect x="515" y="365" width="230" height="36" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="630" y="387" text-anchor="middle" font-size="11.5" font-weight="600">Tentukan Solusi Ideal A+ &amp; A-</text>
<line x1="630" y1="401" x2="630" y2="425" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- S4 -->
<rect x="515" y="425" width="230" height="36" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="630" y="447" text-anchor="middle" font-size="11.5" font-weight="600">Hitung Jarak D+, D- &amp; Preferensi Vi</text>
<line x1="630" y1="461" x2="630" y2="485" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- S5 -->
<rect x="515" y="485" width="230" height="36" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="630" y="507" text-anchor="middle" font-size="11.5" font-weight="600">Urutkan Peringkat &amp; Simpan Hasil</text>
<path d="M 515 503 L 325 503" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- A3 -->
<rect x="135" y="485" width="190" height="36" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
<text x="230" y="507" text-anchor="middle" font-size="11.5" font-weight="600">Lihat Ranking &amp; Cetak PDF</text>
<line x1="230" y1="521" x2="230" y2="565" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Final -->
<circle cx="230" cy="580" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<circle cx="230" cy="580" r="7" fill="#0f172a"/>

</svg>

</html>
